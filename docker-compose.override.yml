# KNQA local-development overrides — merged automatically by `docker compose up`.
# Environment variables override local.cfg/dspace.cfg inside the container
# (__P__ = "." and __D__ = "-" in property names).
services:
  dspace:
    environment:
      dspace__P__name: 'KNQA Digital Repository'
      dspace__P__server__P__url: http://localhost:8080/server
      dspace__P__ui__P__url: http://localhost:4000
      # Allow the Angular dev server origin to call this backend
      rest__P__cors__P__allowed__D__origins: 'http://localhost:4000'
